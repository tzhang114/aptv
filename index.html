<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APTV 播放列表编辑器</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#007AFF;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#007AFF;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0062cc;
}

.list{
    margin-top:30px;
}

.channel{
    background:#f0f0f0;
    border-radius:8px;
    padding:12px;
    margin-top:10px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#888;
}
</style>

</head>

<body>

<div class="container">

<h1>📺 APTV 播放列表编辑器</h1>

<label>频道名称</label>
<input
id="name"
placeholder="例如：李连杰功夫">

<label>频道分组</label>

<select id="group">

<option>电影</option>

<option>电视剧</option>

<option>央视</option>

<option>卫视</option>

<option>港澳</option>

<option>台湾</option>

<option>国际</option>

<option>体育</option>

<option>少儿</option>

<option>纪录片</option>

<option>音乐</option>

<option>其它</option>

</select>

<label>播放地址</label>

<input
id="url"
placeholder="https://......">

<button id="addBtn">
➕ 添加频道
</button>

<button id="exportBtn">
📤 导出 playlist.m3u
</button>

<div class="list">

<h2>频道列表</h2>

<div id="channelList">

<p>目前还没有频道。</p >

</div>

</div>

<div class="footer">

APTV Playlist Editor<br>

GitHub：tzhang114

</div>

</div>
    
<script>

let channels=[];

function render(){

    let list=document.getElementById("channelList");

    if(channels.length===0){

        list.innerHTML="<p>目前还没有频道。</p >";

        return;

    }

    let html="";

    channels.forEach((c,index)=>{

        html+=`
        <div class="channel">

        <b>${c.name}</b><br>

        分组：${c.group}<br>

        <small>${c.url}</small><br><br>

        <button onclick="removeChannel(${index})">
        删除
        </button>

        </div>
        `;

    });

    list.innerHTML=html;

}

document.getElementById("addBtn").onclick=function(){

    let name=document.getElementById("name").value.trim();

    let group=document.getElementById("group").value;

    let url=document.getElementById("url").value.trim();

    if(name==""||url==""){

        alert("请输入频道名称和播放地址");

        return;

    }

    channels.push({

        name:name,

        group:group,

        url:url

    });

    localStorage.setItem("aptv",JSON.stringify(channels));

    render();

    document.getElementById("name").value="";

    document.getElementById("url").value="";

};

function removeChannel(i){

    channels.splice(i,1);

    localStorage.setItem("aptv",JSON.stringify(channels));

    render();

}

window.onload=function(){

    let data=localStorage.getItem("aptv");

    if(data){

        channels=JSON.parse(data);

    }

    render();

};
document.getElementById("exportBtn").onclick = function () {

    let text = "#EXTM3U\n\n";

    channels.forEach(function(c){

        text += "#EXTINF:-1 group-title=\"" + c.group + "\"," + c.name + "\n";

        text += c.url + "\n\n";

    });

    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "playlist.m3u";

    a.click();

    URL.revokeObjectURL(a.href);

};
</script>
    
</body>
</html>
